[project]
name = "smartphone-absa"
version = "0.1.0"
description = "Local aspect-based sentiment analysis of smartphone reviews"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pysbd>=0.3.4,<0.4",
  "vaderSentiment>=3.3.2,<4",
  "langdetect>=1.0.9,<2",
  "scikit-learn>=1.6,<2",
  "numpy>=2,<3",
]

[project.optional-dependencies]
training = ["torch>=2.6,<3", "transformers>=4.49,<5", "accelerate>=1.4,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
absa = "smartphone_absa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartphone_absa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]
